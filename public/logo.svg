<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background gradient -->
    <radialGradient id="bgGrad" cx="50%" cy="35%" r="70%">
      <stop offset="0%" stop-color="#1e1238"/>
      <stop offset="55%" stop-color="#1a0b2e"/>
      <stop offset="100%" stop-color="#0d0521"/>
    </radialGradient>
    <!-- Gold gradient -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f0d878"/>
      <stop offset="40%" stop-color="#d4af37"/>
      <stop offset="100%" stop-color="#b8941f"/>
    </linearGradient>
    <!-- Purple gradient -->
    <linearGradient id="purpleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a78bfa"/>
      <stop offset="100%" stop-color="#7c3aed"/>
    </linearGradient>
    <!-- Teal gradient -->
    <linearGradient id="tealGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2dd4bf"/>
      <stop offset="100%" stop-color="#0d9488"/>
    </linearGradient>
    <!-- Glow filter -->
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="8" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="softGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="4" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Rounded square background -->
  <rect x="16" y="16" width="480" height="480" rx="96" ry="96" fill="url(#bgGrad)"/>

  <!-- Outer decorative ring -->
  <circle cx="256" cy="256" r="200" fill="none" stroke="url(#goldGrad)" stroke-width="2" opacity="0.3"/>
  <circle cx="256" cy="256" r="185" fill="none" stroke="url(#purpleGrad)" stroke-width="1" opacity="0.2"/>

  <!-- Zodiac wheel - 12 segments -->
  <g opacity="0.15">
    <circle cx="256" cy="256" r="170" fill="none" stroke="#d4af37" stroke-width="1"/>
    <!-- 12 division marks -->
    <g stroke="#d4af37" stroke-width="1.5">
      <line x1="256" y1="86" x2="256" y2="106"/>
      <line x1="340" y1="108" x2="330" y2="126"/>
      <line x1="404" y1="172" x2="386" y2="182"/>
      <line x1="426" y1="256" x2="406" y2="256"/>
      <line x1="404" y1="340" x2="386" y2="330"/>
      <line x1="340" y1="404" x2="330" y2="386"/>
      <line x1="256" y1="426" x2="256" y2="406"/>
      <line x1="172" y1="404" x2="182" y2="386"/>
      <line x1="108" y1="340" x2="126" y2="330"/>
      <line x1="86" y1="256" x2="106" y2="256"/>
      <line x1="108" y1="172" x2="126" y2="182"/>
      <line x1="172" y1="108" x2="182" y2="126"/>
    </g>
  </g>

  <!-- Central hexagram (Star of David / cosmic seal) -->
  <g filter="url(#softGlow)" opacity="0.25">
    <!-- Upward triangle -->
    <polygon points="256,120 372,322 140,322" fill="none" stroke="url(#purpleGrad)" stroke-width="2"/>
    <!-- Downward triangle -->
    <polygon points="256,392 140,190 372,190" fill="none" stroke="url(#goldGrad)" stroke-width="2"/>
  </g>

  <!-- Central golden star (5-pointed) -->
  <g filter="url(#glow)">
    <polygon points="256,140 284,228 376,228 302,282 328,370 256,316 184,370 210,282 136,228 228,228"
             fill="url(#goldGrad)" opacity="0.9"/>
  </g>

  <!-- Inner circle with zodiac symbols -->
  <circle cx="256" cy="256" r="75" fill="#0d0521" opacity="0.6"/>
  <circle cx="256" cy="256" r="75" fill="none" stroke="url(#goldGrad)" stroke-width="1.5" opacity="0.6"/>

  <!-- Planet orbit dots -->
  <g opacity="0.4">
    <circle cx="256" cy="170" r="4" fill="url(#goldGrad)"/>
    <circle cx="330" cy="210" r="3" fill="url(#purpleGrad)"/>
    <circle cx="340" cy="290" r="3.5" fill="url(#tealGrad)"/>
    <circle cx="256" cy="340" r="4" fill="url(#goldGrad)"/>
    <circle cx="175" cy="290" r="3" fill="url(#purpleGrad)"/>
    <circle cx="185" cy="210" r="3.5" fill="url(#tealGrad)"/>
  </g>

  <!-- "LZ" monogram -->
  <text x="256" y="248" text-anchor="middle" dominant-baseline="middle"
        font-family="'Cinzel', 'Georgia', serif" font-size="52" font-weight="700"
        fill="url(#goldGrad)" filter="url(#softGlow)">LZ</text>

  <!-- Small dot below monogram -->
  <circle cx="256" cy="278" r="2.5" fill="#d4af37" opacity="0.7"/>

  <!-- "LOTTOZEN" text at bottom -->
  <text x="256" y="445" text-anchor="middle"
        font-family="'Cinzel', 'Georgia', serif" font-size="18" font-weight="600"
        fill="url(#goldGrad)" letter-spacing="4">LOTTOZEN</text>
  <text x="256" y="465" text-anchor="middle"
        font-family="'Inter', sans-serif" font-size="10" font-weight="500"
        fill="#a78bfa" letter-spacing="6" opacity="0.7">ULTRA</text>

  <!-- Corner sparkles -->
  <g opacity="0.3" fill="#d4af37">
    <circle cx="80" cy="80" r="2"/>
    <circle cx="432" cy="80" r="2"/>
    <circle cx="80" cy="432" r="2"/>
    <circle cx="432" cy="432" r="2"/>
  </g>
</svg>
