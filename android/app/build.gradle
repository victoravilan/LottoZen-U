plugins {
    id 'com.android.application'
}

android {
    namespace 'com.lottozen.ultra'
    compileSdk 35

    defaultConfig {
        applicationId "com.lottozen.ultra"
        minSdk 24
        targetSdk 35
        versionCode 3
        versionName "2.1.0"
    }

    signingConfigs {
        release {
            // NOTE: This will be configured when you create your keystore
            // See the step-by-step guide for instructions
            // For now, using debug signing - REPLACE before publishing!
            storeFile file('debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
    }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            signingConfig signingConfigs.release
        }
        debug {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    // Generate AAB (Android App Bundle) for Google Play Store
    bundle {
        language {
            enableSplit = false
        }
        density {
            enableSplit = true
        }
        abi {
            enableSplit = true
        }
    }

    sourceSets {
        main {
            assets.srcDirs = ['src/main/assets', '../dist']
        }
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'androidx.webkit:webkit:1.12.1'
    implementation 'com.google.android.material:material:1.12.0'
}
