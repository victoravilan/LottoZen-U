<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
  <meta http-equiv="Pragma" content="no-cache" />
  <meta http-equiv="Expires" content="0" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, viewport-fit=cover" />
  <meta name="theme-color" content="#1a0b2e" />
  <meta name="description" content="LottoZen Ultra - Tus numeros de la suerte personalizados mediante numerologia y analisis estadistico de loterias europeas" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="LottoZen Ultra" />
  <link rel="manifest" href="./manifest.json" />
  <link rel="icon" type="image/svg+xml" href="./logo.svg" />
  <link rel="apple-touch-icon" href="./icon-192.png" />
  <link rel="preload" href="./logo.svg" as="image" />
  <title>LottoZen Ultra - Numerologia Predictiva</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    :root {
      --bg-primary: #0d0521;
      --bg-secondary: #1a0b2e;
      --bg-card: #1e1238;
      --bg-card-hover: #261845;
      --accent-gold: #d4af37;
      --accent-gold-light: #f0d878;
      --accent-purple: #8b5cf6;
      --accent-purple-light: #a78bfa;
      --accent-pink: #ec4899;
      --accent-teal: #14b8a6;
      --text-primary: #f5f0ff;
      --text-secondary: #b8a8d4;
      --text-muted: #7c6f99;
      --border: rgba(139, 92, 246, 0.2);
      --border-gold: rgba(212, 175, 55, 0.3);
      --success: #10b981;
      --warning: #f59e0b;
      --danger: #ef4444;
    }
    body {
      font-family: 'Inter', system-ui, -apple-system, sans-serif;
      background: var(--bg-primary);
      color: var(--text-primary);
      min-height: 100vh;
      overflow-x: hidden;
    }
    #root { min-height: 100vh; }
    .font-display { font-family: 'Cinzel', serif; }
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }
    @keyframes glow {
      0%, 100% { box-shadow: 0 0 20px rgba(212, 175, 55, 0.3), 0 0 40px rgba(139, 92, 246, 0.15); }
      50% { box-shadow: 0 0 30px rgba(212, 175, 55, 0.5), 0 0 60px rgba(139, 92, 246, 0.3); }
    }
    @keyframes shimmer {
      0% { background-position: -200% center; }
      100% { background-position: 200% center; }
    }
    @keyframes float {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-10px); }
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
    @keyframes pulse-ring {
      0% { transform: scale(0.95); opacity: 1; }
      100% { transform: scale(1.4); opacity: 0; }
    }
    ::-webkit-scrollbar { width: 8px; }
    ::-webkit-scrollbar-track { background: var(--bg-secondary); }
    ::-webkit-scrollbar-thumb { background: var(--accent-purple); border-radius: 4px; }
    ::-webkit-scrollbar-thumb:hover { background: var(--accent-purple-light); }
  </style>
</head>
<body>
  <div id="root">
    <!-- Fallback visible mientras React carga - si React falla, esto se queda visible -->
    <div id="loading-fallback" style="text-align:center;padding:60px 20px;color:#f5f0ff;background:#0d0521;min-height:100vh">
      <img src="./logo.svg" alt="LottoZen Ultra" style="width:100px;height:100px;margin:0 auto 20px;display:block;filter:drop-shadow(0 0 15px rgba(212,175,55,0.4))" />
      <h2 style="font-family:'Cinzel',serif;font-size:24px;color:#d4af37;margin-bottom:12px">LottoZen Ultra</h2>
      <p style="color:#b8a8d4;font-size:14px">Cargando motor cosmico de 13 sistemas...</p>
    </div>
  </div>
  <script>
    // Limpiar TODOS los service workers antes de cargar React
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.getRegistrations().then(function(registrations) {
        registrations.forEach(function(registration) {
          registration.unregister();
        });
      });
    }
    // Limpiar TODAS las caches
    if ('caches' in window) {
      caches.keys().then(function(names) {
        names.forEach(function(name) { caches.delete(name); });
      });
    }
  </script>
  <script type="module" src="./src/main.tsx"></script>
</body>
</html>
